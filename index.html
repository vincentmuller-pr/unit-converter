<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/style.css">
    <title>Unit Converter</title>
</head>
<body>
    <main class="converter-app">
        <div>
            <header>
                <h1>Unit Converter</h1>
            </header>
            <nav>
                <button id="lengthButton" class="active">Length</button>
                <button id="weightButton">Weight</button>
                <button id="temperatureButton">Temperature</button>
            </nav>
        </div>
        <section class="converter-type">
            <form class="converter-form">
                <div class="inputBox">
                    <label for="quantity">Enter the length to convert</label>
                    <input type="number" name="entry" id="quantity" required>
                </div>
                <div class="inputBox">
                    <label for="unitFrom">Unit to convert from</label>
                    <select name="" id="unitFrom">
                        <option value="">-- Select an unit to convert from --</option>
                        <option value="mm">Milimeter (mm)</option>
                        <option value="cm">Centimeter (cm)</option>
                        <option value="m">Meter (m)</option>
                        <option value="km">Kilometer (km)</option>
                        <option value="in">Inch (in)</option>
                        <option value="ft">Foot (ft)</option>
                        <option value="yd">Yard (yd)</option>
                        <option value="mi">Mile (mi)</option>
                    </select>
                </div>
                <div class="inputBox">
                    <label for="unitTo">Unit to convert to</label>
                    <select name="" id="unitTo">
                        <option value="">-- Select an unit to convert to --</option>
                        <option value="mm">Milimeter (mm)</option>
                        <option value="cm">Centimeter (cm)</option>
                        <option value="m">Meter (m)</option>
                        <option value="km">Kilometer (km)</option>
                        <option value="in">Inch (in)</option>
                        <option value="ft">Foot (ft)</option>
                        <option value="yd">Yard (yd)</option>
                        <option value="mi">Mile (mi)</option>
                    </select>
                </div>
                <input type="submit" name="" id="">
            </form>
        </section>
    </main>
    <script src="./scripts/script.js"></script>
</body>
</html>
