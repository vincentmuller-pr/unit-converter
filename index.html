<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/style.css">
    <title>Unit Converter</title>
</head>
<body>
    <main class="converter-app">
        <div>
            <header>
                <h1>Unit Converter</h1>
            </header>
            <nav>
                <button id="lengthButton">Length</button>
                <button id="weightButton">Weight</button>
                <button id="temperatureButton">Temperature</button>
            </nav>
        </div>
        <section class="converter-type">
            <form class="converter-form" id="converterForm">
                <div class="inputBox">
                    <label for="quantity" id="quantityLabel">Enter the {type} to convert</label>
                    <input type="number" name="quantity" id="quantity" placeholder="0" required>
                </div>
                <div class="inputBox">
                    <label for="unitFrom">Unit to convert from</label>
                    <select name="unitFrom" id="unitFrom" required>
                        <!--Generado dinamicamente por JS-->
                    </select>
                </div>
                <div class="inputBox">
                    <label for="unitTo">Unit to convert to</label>
                    <select name="unitTo" id="unitTo" required>
                        <!--Generado dinamicamente por JS-->
                    </select>
                </div>
                <button type="button" id="reverseButton">Reverse</button>
                <button type="submit">Convert</button>
            </form>
        </section>
        <section class="converter-result">
            <h2 id="resultTitle">Result:</h2>
        </section>
    </main>
    <script type="module" src="./scripts/script.js"></script>
</body>
</html>
